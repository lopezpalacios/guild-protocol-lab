[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = true
evm_version = "cancun"
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
]
fs_permissions = [
  { access = "read-write", path = "../deployments" },
  { access = "read-write", path = "../data" },
  { access = "read-write", path = "../web" },
]

[profile.ci]
fuzz = { runs = 256 }
verbosity = 3

[fuzz]
runs = 64
